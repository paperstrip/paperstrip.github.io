<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Arnaud Herr">
  <!-- Reprise du logo : le A du nom, et le point d'accent qui le suit.
       Les lettres sont tracees a la main plutot que composees : une favicon
       ne peut pas dependre d'une police que le navigateur ne chargera pas. -->
  <rect width="64" height="64" rx="14" fill="#17161C"/>
  <path d="M12 47 L26 15 L40 47" fill="none" stroke="#FFFFFF" stroke-width="6.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M18.4 37 H33.6" fill="none" stroke="#FFFFFF" stroke-width="6.4"
        stroke-linecap="round"/>
  <circle cx="50" cy="44.5" r="4.6" fill="#9B87E0"/>
</svg>
